<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextpower Arabia Eid Greeting Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'GothamBold';
      src: url('Gotham-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: 'GothamLight';
      src: url('Gotham-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #1f2a44;
    }

    .page {
      min-height: 100vh;
      padding: 40px 20px;
    }

    .header {
      max-width: 100%;
      margin: 0 auto 30px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-left: 10px;
    }

    .header-logo {
      height: 34px;
      width: auto;
      display: block;
    }

    .header-text {
      text-align: center;
      width: 100%;
      position: relative;
      top: 40px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 42px;
      line-height: 1.1;
      color: #1e3a6d;
    }

    .header p {
      margin: 0;
      font-size: 18px;
      color: #5f6b85;
    }

    .layout {
      max-width: 1200px;
      margin: 80px auto 0;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 28px;
      align-items: start;
    }

    .panel,
    .preview-panel {
      background: #ffffff;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(19, 34, 68, 0.08);
    }

    .panel h2,
    .preview-panel h2 {
      margin: 0 0 22px;
      font-size: 24px;
      color: #1f2a44;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #4a5772;
    }

    .field input {
      width: 100%;
      height: 52px;
      border: 1px solid #d9dfeb;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
    }

    .tip {
      margin-top: 10px;
      padding: 16px 18px;
      border-radius: 14px;
      background: #f7f8fb;
      color: #5f6b85;
      font-size: 14px;
      line-height: 1.5;
    }

    .preview-frame {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .card-wrap {
      width: 100%;
      max-width: 540px;
    }

    .card {
      position: relative;
      width: 100%;
      background: transparent;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .overlay-name,
    .overlay-title {
      position: absolute;
      left: 50%;
      width: 52%;
      transform: translateX(-50%);
      text-align: center;
      color: #000000;
      z-index: 2;
      word-break: normal;
      white-space: normal;
      font-family: 'Noto Kufi Arabic', Arial, sans-serif;
    }

    .overlay-name {
      top: 30%;
      font-family: 'Noto Kufi Arabic', Arial, sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.08;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
    }

    .overlay-title {
      top: 36%;
      font-family: 'Noto Kufi Arabic', Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      text-shadow: none;
      letter-spacing: 0.2px;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 180px;
      height: 52px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }

    .btn-png {
      background: #1e3a6d;
    }

    .btn-jpg {
      background: #c8a227;
    }

    .btn-share {
      background: #2d6cdf;
      display: none;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 34px;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px 14px;
      }

      .panel,
      .preview-panel {
        padding: 18px;
        border-radius: 18px;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .header-logo {
        height: 36px;
      }

      .header-text {
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
      }

      .header p {
        font-size: 15px;
      }

      .overlay-name,
      .overlay-title {
        left: 50%;
        width: 54%;
      }

      .overlay-name {
        top: 33%;
        font-size: 14px;
      }

      .overlay-title {
        top: 36%;
        font-size: 12px;
      }

      .btn-share {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="header-top">
        <img src="nextpower-logo.png" alt="NextPower Arabia Logo" class="header-logo" />
        <div class="header-text">
          <h1>Create Your Personalized Card</h1>
          <p>Enter your details below and download your custom greeting card in high resolution</p>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>Your Details</h2>

        <div class="field">
          <label for="name">Your Name</label>
          <input id="name" type="text" placeholder="Enter your name" />
        </div>

        <div class="field">
          <label for="title">Your Position</label>
          <input id="title" type="text" placeholder="Enter your job title" />
        </div>

        <div class="tip">
          Tip: Your name and position will appear on the card automatically while typing.
        </div>
      </div>

      <div class="preview-panel">
        <h2>Live Preview</h2>

        <div class="preview-frame">
          <div class="card-wrap">
            <div class="card" id="captureArea">
              <img src="eid-design.jpg" id="design" alt="Eid Design" />
              <div class="overlay-name" id="nameText" dir="auto" lang="auto">Your Name</div>
              <div class="overlay-title" id="titleText" dir="auto" lang="auto">Your Position</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-png" id="downloadPng">Download PNG</button>
          <button class="btn btn-jpg" id="downloadJpg">Download JPG</button>
          <button class="btn btn-share" id="shareCard">Share</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const nameInput = document.getElementById("name");
    const titleInput = document.getElementById("title");
    const nameText = document.getElementById("nameText");
    const titleText = document.getElementById("titleText");
    const captureArea = document.getElementById("captureArea");

    function hasArabic(text) {

  return /[\u0600-\u06FF]/.test(text);

}

function updateTextDirection(element, value) {

  if (hasArabic(value)) {

    element.setAttribute("dir", "rtl");

    element.setAttribute("lang", "ar");

    element.style.fontFamily = "'Noto Kufi Arabic', Arial, sans-serif";

    element.style.textAlign = "center";

  } else {

    element.setAttribute("dir", "ltr");

    element.setAttribute("lang", "en");

    element.style.fontFamily = "'GothamBold', Arial, sans-serif";

    element.style.textAlign = "center";

  }

}

function updateCard() {

  const nameValue = nameInput.value.trim();

  const titleValue = titleInput.value.trim();

  nameText.textContent = nameValue || "Your Name";

  titleText.textContent = titleValue || "Your Position";

  updateTextDirection(nameText, nameValue);

  updateTextDirection(titleText, titleValue);

}

    nameInput.addEventListener("input", updateCard);
    titleInput.addEventListener("input", updateCard);

    function hasArabic(text) {

  return /[\u0600-\u06FF]/.test(text);

}

async function createFinalCanvas() {

  await document.fonts.ready;

  const img = document.getElementById("design");

  if (!img.complete) {

    await new Promise(resolve => {

      img.onload = resolve;

    });

  }

  const canvas = document.createElement("canvas");

  const ctx = canvas.getContext("2d");

  const w = img.naturalWidth;

  const h = img.naturalHeight;

  canvas.width = w;

  canvas.height = h;

  ctx.drawImage(img, 0, 0, w, h);

  const nameValue = nameInput.value.trim() || "Your Name";

  const titleValue = titleInput.value.trim() || "Your Position";

  const isArabicName = hasArabic(nameValue);

  const isArabicTitle = hasArabic(titleValue);

  // Change these numbers to move the text

  const centerX = w * 0.50;

  const nameY = h * 0.36;

  const titleY = h * 0.40;

  // Name style

  ctx.fillStyle = "#000000";

  ctx.textAlign = "center";

  ctx.direction = isArabicName ? "rtl" : "ltr";

  ctx.font = isArabicName

    ? `700 ${Math.round(w * 0.035)}px "Noto Kufi Arabic", Arial, sans-serif`

    : `700 ${Math.round(w * 0.035)}px Arial, sans-serif`;

  ctx.fillText(nameValue, centerX, nameY);

  // Title style

  ctx.fillStyle = "#000000";

  ctx.textAlign = "center";

  ctx.direction = isArabicTitle ? "rtl" : "ltr";

  ctx.font = isArabicTitle

    ? `400 ${Math.round(w * 0.024)}px "Noto Kufi Arabic", Arial, sans-serif`

    : `400 ${Math.round(w * 0.024)}px Arial, sans-serif`;

  ctx.fillText(titleValue, centerX, titleY);

  return canvas;

}

async function downloadCard(type) {

  const canvas = await createFinalCanvas();

  const link = document.createElement("a");

  const safeName = (nameInput.value.trim() || "NextPower").replace(/\s+/g, "_");

  if (type === "jpg") {

    link.download = safeName + "_Eid_Greeting.jpg";

    link.href = canvas.toDataURL("image/jpeg", 0.95);

  } else {

    link.download = safeName + "_Eid_Greeting.png";

    link.href = canvas.toDataURL("image/png");

  }

  link.click();

}

    document.getElementById("downloadPng").addEventListener("click", () => downloadCard("png"));
    document.getElementById("downloadJpg").addEventListener("click", () => downloadCard("jpg"));

   document.getElementById("shareCard").addEventListener("click", async () => {

  if (!navigator.share) {

    alert("Sharing is supported on mobile devices only.");

    return;

  }

  const canvas = await createFinalCanvas();

  canvas.toBlob(async (blob) => {

    if (!blob) {

      alert("Unable to generate image for sharing.");

      return;

    }

    const file = new File([blob], "NextPower_Eid_Card.png", {

      type: "image/png"

    });

    try {

      await navigator.share({

        title: "Eid Mubarak - NextPower Arabia",

        text: "Wishing you a blessed Eid from NextPower Arabia.",

        files: [file]

      });

    } catch (error) {

      console.log("Share cancelled");

    }

  }, "image/png");

});
    updateCard();
  </script>
</body>
</html>
